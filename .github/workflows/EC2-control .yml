# This is a basic workflow to Control EC2 instance status

name: Start, Stop and Terminate EC2 instances
on:
  workflow_dispatch:
   inputs:
     action:
      description: "Select action"
      required: true
      type: choice
      options:
        - start
        - stop
        - terminate
jobs:
  EC2-Control:
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS Credentials with Secrets
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ vars.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-1
      
      - name: Start EC2 instance
        if: ${{ inputs.action == 'start' }}
        run: |
         echo "starting the instance"
         aws ec2 start-instances \
           --instance-ids i-0fabe39ff3e632633 \
           --region ap-southeast-1
         echo "Instance started"    

      - name: Stop EC2 instance
        if: ${{ inputs.action == 'stop' }}
        run: |
         echo "Stopping the instance"
         aws ec2 stop-instances \
           --instance-ids i-0fabe39ff3e632633 \
           --region ap-southeast-1
         echo "Instance stopped"  

      - name: Terminate EC2 instance
        if: ${{ inputs.action == 'terminate' }}
        run: |
         echo "terminating the instance"
         aws ec2 terminate-instances \
           --instance-ids i-0fabe39ff3e632633 \
           --region ap-southeast-1
